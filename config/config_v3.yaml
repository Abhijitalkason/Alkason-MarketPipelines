# PLAN v3 — Intraday Selective Signal System configuration
# Section references → PLAN_v3.md + v3_supplementry.md §2.
# Every key here is consumed by code; tests/test_config.py fails on dead keys.

universe:
  membership_file: data/reference/universe_membership.csv   # point-in-time membership
  index_symbol: "NIFTY 50"            # index for alignment features
  min_median_1min_volume: 5000        # liquidity floor — enforced in screener (H-1)
  max_median_spread_bps: 5            # spread floor — enforced when depth exists (H-1)

data:
  provider: upstox                    # upstox (kite: not implemented — fail loudly)
  bars_path: data/bars
  bhavcopy_path: data/bhavcopy
  preopen_path: data/preopen
  depth_path: data/depth
  reference_path: data/reference
  regime_path: data/regime            # PLAN_v4 §5 — global/macro + news regime store
  backfill_years: 3
  record_depth_levels: 5
  bar_freq_decision: 15min            # decision bars
  bar_freq_feature: 5min              # feature computation bars
  session_open: "09:15"
  session_close: "15:30"
  timezone: Asia/Kolkata              # all session logic pinned to IST (M-7)
  live_poll_seconds: 10               # screened-name poll cadence after 09:30 (H-3)
  max_flow_missing_share: 0.40        # flow real-data floor — raises FlowDataError (B-5)
  max_skip_share: 0.05                # dataset-thinning tolerance — raises (M-1)

screen:
  time: "09:30:05"
  top_n: 12
  gap_band: [0.003, 0.025]            # |gap| must be inside this band for gap_quality
  lookback_days: 20
  weights:                            # live DEFAULTS; per-fold fitted weights override (§5.3)
    volume_surge: 0.30
    range_expansion: 0.20
    gap_quality: 0.15
    preopen_imbalance: 0.15
    delivery_z: 0.10
    index_alignment: 0.10

geometry:                             # PLAN_v4 §4 — retargeted to the 80% floor, WIDE width
  target_atr: 0.75                    # a — floor b/(a+b) = 3.00/3.75 = 0.80
  stop_atr: 3.00                      # b — wide stop lowers required edge δ = c/W
  time_barrier_hours: 2               # matches the 1–2h trade duration (PLAN_v4 §1.2 corr. 3)
  squareoff: "14:45"
  atr_window_minutes: 120
  entry_window: ["09:30", "11:00"]

geometry_study:                       # PLAN_v4 §4 — grid accept/reject thresholds (config-driven)
  min_baseline: 0.76                  # floor must sit BELOW the 0.80 target so the model adds edge
  max_baseline: 0.84                  # too-high floor reproduces the v3 trap (δ unreachable)
  max_required_delta_pts: 3.0

gate:                                 # PLAN_v4 §4 — 80% contract
  fire_threshold_init: 0.84           # tau_0 a few pts above target so ACI relaxes to equilibrium
  aci_gamma: 0.01
  target_win_rate: 0.80               # alpha = 1 - target_win_rate = 0.20
  model_agreement_floor: 0.75
  calibration_window_days: 60         # rolling recalibration window (trainer --mode recalibrate)
  flow_model_active: false            # staged activation (B-5); trainer flips when
                                      # flow_real_share >= flow_activation_share
  flow_activation_share: 0.60

training:                             # Section 12
  train_min_months: 18
  test_fold_months: 3
  min_folds: 6                        # walk-forward must produce at least this many OOS folds
  embargo_days: 1
  tune: true                          # Optuna tuning on the inner train split (CI sets false)
  optuna_trials: 30
  blend_weight_init: 0.6
  random_state: 42
  inner_calib_days: 60                # day-boundary inner calibration tail (M-3)
  recalib_min_signals: 200            # rolling recalibration aborts below this

costs:                                # Section 12.1 — single source of truth = src/intraday/costs.py
  brokerage_per_order_inr: 20
  stt_sell_pct: 0.00025
  exchange_txn_pct: 0.0000297
  sebi_fee_pct: 0.000001
  stamp_buy_pct: 0.00003
  gst_pct: 0.18
  slippage_half_spread_pct: 0.0002    # per-side half-spread component (H-7)
  impact_coeff: 0.10                  # impact = coeff * (qty / median_1min_volume), per side
  slippage_stress_multiplier: 2.0

risk:                                 # Section 13
  risk_per_trade_pct: 0.004
  max_positions: 4
  max_per_sector: 2
  daily_loss_limit_pct: 0.015
  max_leverage: 3.0
  blackout: [expiry, results, rbi, fed, budget]
  expiry_weekday: 3                   # Thursday (0=Mon) — weekly index expiry blackout

regime:                               # PLAN_v4 §7 — pre-open regime veto (staged, like flow)
  active: false                       # flips true only after Run C shows it doesn't hurt
  no_trade_abs_score: 0.75            # |risk_score| above this + risk-off + vol spike ⇒ stand down
  direction_veto_threshold: 0.50      # suppress signals fighting a regime this strong
  bias_deadzone: 0.10                 # |risk_score| below this ⇒ neutral bias
  vix_spike_5d: 0.20                  # 5-day VIX change flagged as a spike (chaotic regime)
  weights:                            # composite risk_score component weights
    spx: 0.30
    ndx: 0.25
    asia: 0.20
    usdinr: 0.15
    vix: 0.10

drift:                                # B-7 — Evidently drift → ACI recalib → halt
  reference_artifact: feature_matrix  # production model's training matrix (drift reference)
  current_window_sessions: 10
  share_drifted_columns_alert: 0.30
  consecutive_breaches_to_halt: 2

gates:                                # PLAN_v4 §6.4 — machine-checkable acceptance gates
  min_win_rate: 0.80                  # retargeted from 0.89 (PLAN_v4 §1.2)
  min_expectancy_pct: 0.0005
  min_signals_per_day: 1.0
  leakage_alarm_win_rate: 0.90        # ~+10pt margin over the 0.80 floor (retuned)
  leakage_alarm_coverage: 0.10
  calibration_max_gap: 0.03           # |expected − realized| win rate in fired region
  paper_days: 22
  paper_max_winrate_gap: 0.03
  min_data_names_frac: 0.90           # Gate 1: names_ok / PIT-universe size (PLAN_v4 §3, M0)

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: intraday-selective-v3
  registry_model_name: intraday-v3-signal

api:                                  # Section 13 (supplementary)
  host: 0.0.0.0
  port: 8000
  api_key_env: V3_API_KEY             # name of env var holding the API key

paths:
  reports: reports/v3
  signals_log: reports/v3/signals
  journal: reports/v3/journal
  alerts: reports/v3/alerts
  gates: reports/v3/gates
  drift: reports/v3/drift
  run_registry: reports/v3/run_registry.csv
  state: models/v3                    # gate state, blend, models

v6:                                   # PLAN_v6 §4.4 — delivery (CNC) cost stack; broker: Upstox (user decision 2026-07-08)
  position_size_inr: 100000           # reference size for ALL gate arithmetic (§4.4; revisited at Gate 3 per the curve)
  max_auction_participation_pct: 0.05 # cap vs PRE-OPEN AUCTION volume, not daily turnover (F18) [VERIFY per-symbol]
  delivery_costs:                     # every constant cited — source: upstox.com/brokerage-charges [VERIFIED 2026-07-08]
    brokerage_per_order_inr: 20       # equity delivery, flat ₹20 per executed order (buy and sell)
    stt_pct: 0.001                    # STT 0.1% on buy AND sell (delivery; rate effective 2024-10-01)
    exchange_txn_pct: 0.0000307       # NSE 0.00307% per side, effective 2026-03-01 (0.00297% during 2024-10→2026-02)
    sebi_fee_pct: 0.000001            # ₹10/crore per side
    stamp_buy_pct: 0.00015            # 0.015% buy side only
    ipft_pct: 1.0e-9                  # NSE IPFT ₹0.01/crore per side (negligible; kept for completeness)
    dp_sell_flat_inr: 20              # CDSL ₹3.5 + Upstox ₹16.5 per scrip per sell day, + GST
    gst_pct: 0.18                     # on brokerage + exchange txn + IPFT + DP (per Upstox schedule; SEBI fee excluded there)
    open_slippage_pct_per_side: 0.0005 # PROVISIONAL 5bps/side [MEASURE — §4.4/unknown #15: open vs first-15min VWAP study]
    slippage_stress_multiplier: 2.0   # §4.3 2× stress lane
