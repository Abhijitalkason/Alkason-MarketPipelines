# Docker Compose v2 — no version field (deprecated in Docker Compose v2+)
# Requires: Docker Desktop installed
# Start all services: docker-compose -f docker/docker-compose.yaml up

services:

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: mlops_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlruns
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: mlops_api
    ports:
      - "8000:8000"
    volumes:
      # API serves models + reads reports/reference read-only; it never writes
      # data and the broker token never enters this container (host-only).
      - ../models:/app/models:ro
      - ../mlruns:/app/mlruns
      - ../reports:/app/reports
      - ../data/reference:/app/data/reference:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - OLLAMA_BASE_URL=http://ollama:11434
      - V3_API_KEY=${V3_API_KEY}
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; req=urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['V3_API_KEY']}); urllib.request.urlopen(req)"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ollama
    container_name: mlops_ollama
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    restart: unless-stopped

volumes: {}
